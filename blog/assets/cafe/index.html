<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Lorem</title>
  <style>
    body {
      font-family: georgia;
      margin: 0;
      padding: 0;
      line-height: 1.6;
      color: #333;
      background: #fafafa;
    }
    .hero {
      background: url("hero.jpg") center/cover no-repeat;
      height: 700px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 2rem;
      text-shadow: 1px 1px 4px black;
      text-align: center;
      padding: 0 1rem;
    }
    .section {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
      text-align: center;
    }
    .section h2 {
      font-size: 1.4rem;
      margin-bottom: 1rem;
    }
    .section img {
      max-width: 100%;
      border-radius: 5px;
    }
    .contact {
      background: #eee;
      padding: 2rem;
      text-align: center;
    }
    .contact p {
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>
  <div class="hero"><b>
    Welcome to Café Lorem.<br>The best coffee in town.</b>
  </div>

  <div class="section">
    <h2>Coffee | Pastries | Sandwiches</h2>
    <img src="food.jpg">
  </div>

  <div class="contact">
    <h2>Contact Us</h2>
    <p>123 Main Street, YourTown</p>
    <p>Email: hello@cafelorem.com</p>
    <p>Phone: (555) 123-4567</p>
  </div>
</body>
</html>
